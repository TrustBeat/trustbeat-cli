[package]
name = "trustbeat"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Anchor files to qualified eIDAS timestamps and verify the proofs offline."
authors = ["Trustbeat s.r.o. <radim.dejmek@trustbeat.eu>"]
license = "MIT"
repository = "https://github.com/TrustBeat/trustbeat-cli"
homepage = "https://trustbeat.eu"
documentation = "https://docs.rs/trustbeat"
readme = "README.md"
keywords = ["timestamp", "rfc3161", "eidas", "merkle", "notarization"]
categories = ["command-line-utilities", "cryptography"]
# tests/fixtures/demo-proof.json is include_str!'d by proof.rs, so it must ship
# inside the published crate — do not add it to `exclude`.
# The release workflow only matters in the mirrored repo, not to crate consumers.
exclude = [".github/"]

[[bin]]
name = "trustbeat"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# HTTP — blocking + rustls keeps the binary small and tokio-free
ureq = { version = "2.10", default-features = false, features = ["tls", "json", "gzip"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto / ASN.1.
# NOTE: cms 0.2 and x509-cert 0.2 both sit on der 0.7. Do NOT bump x509-cert to
# 0.3 alone — it moves to der 0.8 and the two generations do not interoperate.
cms = "0.2"
x509-cert = "0.2"
der = "0.7"
const-oid = "0.9"
sha2 = { version = "0.10", features = ["oid"] } # "oid" is required for RSA PKCS#1 v1.5
p256 = "0.13"
p384 = "0.13"
rsa = "0.9"
signature = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
